<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 375" width="1000" height="375" role="img" aria-label="System architecture and data flow">
<clipPath id="frameclip"><rect x="0" y="0" width="1000" height="375" rx="14"/></clipPath>
<g clip-path="url(#frameclip)">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111b2e"/>
  </linearGradient>
  <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f5b942" stop-opacity="0.60"/>
    <stop offset="1" stop-color="#f5b942" stop-opacity="0"/>
  </linearGradient>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#1a2740"/>
  </pattern>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
</defs>

<rect width="1000" height="375" fill="url(#bg)"/>
<rect width="1000" height="375" fill="url(#dots)" opacity="0.7"/>
<path id="p_sens" d="M210,180 L370,180" fill="none" stroke="#2a3850" stroke-width="2"/><path id="p_dash" d="M610,160 C690,160 690,65 760,65" fill="none" stroke="#2a3850" stroke-width="2"/><path id="p_admin" d="M610,180 L760,180" fill="none" stroke="#2a3850" stroke-width="2"/><path id="p_cli" d="M610,200 C690,200 690,295 760,295" fill="none" stroke="#2a3850" stroke-width="2"/><path id="p_led" d="M490,230 L490,275" fill="none" stroke="#2a3850" stroke-width="2"/>
<rect x="40" y="140" width="170" height="80" rx="10" fill="#111b2e" stroke="#263247" stroke-width="1.5"/><text x="125.0" y="168" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Sensors</text><text x="125.0" y="188" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">HC-SR04 x 4</text><text x="125.0" y="208" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#f5b942">HC1 - HC4</text>
<rect x="370" y="130" width="240" height="100" rx="10" fill="#111b2e" stroke="#263247" stroke-width="1.5"/><text x="490.0" y="158" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Server</text><text x="490.0" y="178" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">Arduino Uno R4 WiFi</text><text x="490.0" y="198" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#f5b942">lighting logic | dashboard host</text>
<rect x="370" y="275" width="240" height="60" rx="10" fill="#111b2e" stroke="#263247" stroke-width="1.5"/><text x="490.0" y="303" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">LED segments</text><text x="490.0" y="323" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">S1 - S4 (PWM dimming)</text>
<rect x="760" y="30" width="200" height="70" rx="10" fill="#111b2e" stroke="#263247" stroke-width="1.5"/><text x="860.0" y="58" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Web dashboard</text><text x="860.0" y="78" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">hosted on the R4</text>
<rect x="760" y="145" width="200" height="70" rx="10" fill="#111b2e" stroke="#263247" stroke-width="1.5"/><text x="860.0" y="173" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">C# admin app</text><text x="860.0" y="193" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">monitoring | manual control</text>
<rect x="760" y="260" width="200" height="70" rx="10" fill="#111b2e" stroke="#263247" stroke-width="1.5"/><text x="860.0" y="288" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Smart traffic light</text><text x="860.0" y="308" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">client: Arduino Uno R3</text>
<text x="290" y="170" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#64748b">GPIO trigger / echo</text>
<text x="685" y="128" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#64748b">WiFi</text>
<text x="685" y="172" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#64748b">WiFi / UART diag.</text>
<text x="685" y="272" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#64748b">UART</text>
<text x="498" y="257" text-anchor="start" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#64748b">PWM</text>
<circle r="4" fill="#2dd4bf" opacity="0.95"><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite" ><mpath xlink:href="#p_sens"/></animateMotion></circle><circle r="4" fill="#2dd4bf" opacity="0.95"><animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite" ><mpath xlink:href="#p_sens"/></animateMotion></circle><circle r="4" fill="#38bdf8" opacity="0.95"><animateMotion dur="2.4s" begin="0.2s" repeatCount="indefinite" ><mpath xlink:href="#p_dash"/></animateMotion></circle><circle r="4" fill="#38bdf8" opacity="0.95"><animateMotion dur="2.4s" begin="1.4s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear" ><mpath xlink:href="#p_dash"/></animateMotion></circle><circle r="4" fill="#38bdf8" opacity="0.95"><animateMotion dur="2.0s" begin="0.5s" repeatCount="indefinite" ><mpath xlink:href="#p_admin"/></animateMotion></circle><circle r="4" fill="#38bdf8" opacity="0.95"><animateMotion dur="2.0s" begin="1.5s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear" ><mpath xlink:href="#p_admin"/></animateMotion></circle><circle r="4" fill="#f5b942" opacity="0.95"><animateMotion dur="2.2s" begin="0s" repeatCount="indefinite" ><mpath xlink:href="#p_cli"/></animateMotion></circle><circle r="4" fill="#f5b942" opacity="0.95"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear" ><mpath xlink:href="#p_cli"/></animateMotion></circle><circle r="4" fill="#f5b942" opacity="0.95"><animateMotion dur="1.2s" begin="0.3s" repeatCount="indefinite" ><mpath xlink:href="#p_led"/></animateMotion></circle>
<circle cx="46" cy="352" r="4" fill="#2dd4bf"/><text x="58" y="356" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">sensor data</text><circle cx="150" cy="352" r="4" fill="#38bdf8"/><text x="162" y="356" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">WiFi (HTTP / WebSocket)</text><circle cx="330" cy="352" r="4" fill="#f5b942"/><text x="342" y="356" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">UART commands / PWM</text>
</g>
<rect x="0.5" y="0.5" width="999" height="374" rx="13.5" fill="none" stroke="#243047" stroke-width="1"/>
</svg>
