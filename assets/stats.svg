<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="Project at a glance: 4 sensors, 4 lamp segments, 2 boards, 3 modes, 3 applications">
<clipPath id="frameclip"><rect x="0" y="0" width="1200" height="150" rx="14"/></clipPath>
<g clip-path="url(#frameclip)">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111b2e"/>
  </linearGradient>
  <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f5b942" stop-opacity="0.60"/>
    <stop offset="1" stop-color="#f5b942" stop-opacity="0"/>
  </linearGradient>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#1a2740"/>
  </pattern>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
</defs>

<rect width="1200" height="150" fill="url(#bg)"/>
<rect width="1200" height="150" fill="url(#dots)" opacity="0.7"/>
<g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0010;0.5010;1" dur="1.8s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0;0 0" keyTimes="0;0.0010;0.5010;1" dur="1.8s" fill="freeze"/><text x="120" y="78" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" fill="#f1f5f9" font-weight="700" text-anchor="middle" >4</text><text x="120" y="104" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle" >Ultrasonic sensors</text><text x="120" y="126" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#64748b" text-anchor="middle" >HC-SR04</text></g>
<g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0833;0.5833;1" dur="1.8s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0;0 0" keyTimes="0;0.0833;0.5833;1" dur="1.8s" fill="freeze"/><text x="360" y="78" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" fill="#f1f5f9" font-weight="700" text-anchor="middle" >4</text><text x="360" y="104" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle" >Lamp segments</text><text x="360" y="126" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#64748b" text-anchor="middle" >S1 - S4</text></g>
<line x1="240" y1="34" x2="240" y2="116" stroke="#243047"/>
<g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1667;0.6667;1" dur="1.8s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0;0 0" keyTimes="0;0.1667;0.6667;1" dur="1.8s" fill="freeze"/><text x="600" y="78" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" fill="#f1f5f9" font-weight="700" text-anchor="middle" >2</text><text x="600" y="104" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle" >Arduino boards</text><text x="600" y="126" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#64748b" text-anchor="middle" >Uno R4 WiFi + Uno R3</text></g>
<line x1="480" y1="34" x2="480" y2="116" stroke="#243047"/>
<g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2500;0.7500;1" dur="1.8s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0;0 0" keyTimes="0;0.2500;0.7500;1" dur="1.8s" fill="freeze"/><text x="840" y="78" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" fill="#f1f5f9" font-weight="700" text-anchor="middle" >3</text><text x="840" y="104" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle" >Operating modes</text><text x="840" y="126" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#64748b" text-anchor="middle" >AUTO / MANUAL / MAINTENANCE</text></g>
<line x1="720" y1="34" x2="720" y2="116" stroke="#243047"/>
<g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3333;0.8333;1" dur="1.8s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0;0 0" keyTimes="0;0.3333;0.8333;1" dur="1.8s" fill="freeze"/><text x="1080" y="78" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" fill="#f1f5f9" font-weight="700" text-anchor="middle" >3</text><text x="1080" y="104" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle" >Applications</text><text x="1080" y="126" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#64748b" text-anchor="middle" >C# | web | .NET MAUI</text></g>
<line x1="960" y1="34" x2="960" y2="116" stroke="#243047"/>
</g>
<rect x="0.5" y="0.5" width="1199" height="149" rx="13.5" fill="none" stroke="#243047" stroke-width="1"/>
</svg>
