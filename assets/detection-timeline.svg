dth="46" height="20" rx="4" fill="#38bdf8" opacity="0.9"/><rect x="470" y="204" width="46" height="20" rx="4" fill="#38bdf8" opacity="0.9"/><rect x="540" y="252" width="46" height="20" rx="4" fill="#38bdf8" opacity="0.9"/></g><g transform="translate(1320 0)"><line x1="0" y1="96" x2="0" y2="284" stroke="#1a2538"/><line x1="100" y1="96" x2="100" y2="284" stroke="#1a2538"/><line x1="200" y1="96" x2="200" y2="284" stroke="#1a2538"/><line x1="300" y1="96" x2="300" y2="284" stroke="#1a2538"/><line x1="400" y1="96" x2="400" y2="284" stroke="#1a2538"/><line x1="500" y1="96" x2="500" y2="284" stroke="#1a2538"/><rect x="20" y="108" width="64" height="20" rx="4" fill="#38bdf8" opacity="0.9"/><rect x="120" y="156" width="64" height="20" rx="4" fill="#38bdf8" opacity="0.9"/><rect x="220" y="204" width="64" height="20" rx="4" fill="#38bdf8" opacity="0.9"/><rect x="320" y="252" width="64" height="20" rx="4" fill="#38bdf8" opacity="0.9"/><rect x="330" y="108" width="46" height="20" rx="4" fill="#38bdf8" opacity="0.9"/><rect x="400" y="156" width="46" height="20" rx="4" fill="#38bdf8" opacity="0.9"/><rect x="470" y="204" width="46" height="20" rx="4" fill="#38bdf8" opacity="0.9"/><rect x="540" y="252" width="46" height="20" rx="4" fill="#38bdf8" opacity="0.9"/></g></g></g>
<line x1="1130" y1="96" x2="1130" y2="284" stroke="#f5b942" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/><text x="1130" y="304" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#f5b942" text-anchor="middle" >now</text><text x="120" y="304" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#64748b" >timeline of sensor triggers, HC1 - HC4</text>
</g>
<rect x="0.5" y="0.5" width="1199" height="329" rx="13.5" fill="none" stroke="#243047" stroke-width="1"/>
