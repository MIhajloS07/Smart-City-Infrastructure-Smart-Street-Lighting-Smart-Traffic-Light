<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Scrolling timeline of ultrasonic sensor detections as vehicles pass HC1 to HC4">
<clipPath id="frameclip"><rect x="0" y="0" width="1200" height="330" rx="14"/></clipPath>
<g clip-path="url(#frameclip)">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111b2e"/>
  </linearGradient>
  <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f5b942" stop-opacity="0.60"/>
    <stop offset="1" stop-color="#f5b942" stop-opacity="0"/>
  </linearGradient>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#1a2740"/>
  </pattern>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
<linearGradient id="fadeg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.07" stop-color="#fff" stop-opacity="1"/><stop offset="0.93" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="fade" maskUnits="userSpaceOnUse" x="120" y="90" width="1040" height="200"><rect x="120" y="90" width="1040" height="200" fill="url(#fadeg)"/></mask></defs>

<rect width="1200" height="330" fill="url(#bg)"/>
<rect width="1200" height="330" fill="url(#dots)" opacity="0.7"/>
<rect x="40" y="41" width="22" height="2" fill="#f5b942"/><text x="72" y="47" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" fill="#f5b942">DASHBOARD</text>
<text x="40" y="84" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#f1f5f9" font-weight="600" >Detection history</text>
<rect x="100" y="103" width="1080" height="30" rx="6" fill="#0f1726"/>
<text x="44" y="123" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#94a3b8" >HC1</text>
<rect x="100" y="151" width="1080" height="30" rx="6" fill="#0f1726"/>
<text x="44" y="171" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#94a3b8" >HC2</text>
<rect x="100" y="199" width="1080" height="30" rx="6" fill="#0f1726"/>
<text x="44" y="219" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#94a3b8" >HC3</text>
<rect x="100" y="247" width="1080" height="30" rx="6" fill="#0f1726"/>
<text x="44" y="267" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#94a3b8" >HC4</text>
