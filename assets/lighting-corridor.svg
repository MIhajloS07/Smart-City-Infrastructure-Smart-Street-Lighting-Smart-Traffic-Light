<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1200 250" width="1200" height="250" role="img" aria-label="Animated cascading light corridor following a vehicle">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111b2e"/>
  </linearGradient>
  <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f5b942" stop-opacity="0.60"/>
    <stop offset="1" stop-color="#f5b942" stop-opacity="0"/>
  </linearGradient>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#1a2740"/>
  </pattern>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
</defs>

<rect y="150" width="1200" height="250" fill="url(#bg)"/>
<rect y="150" width="1200" height="250" fill="url(#dots)" opacity="0.7"/>
